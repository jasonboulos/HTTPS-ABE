<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>HTTPS ABE Demo</title>
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">HTTPS ABE Demo</h1>
    <h2>Generate Attribute</h2>
    <form action="{{ url_for('generate_attribute') }}" method="post" class="row g-3 mb-4">
        <div class="col-auto">
            <input type="text" class="form-control" name="name" placeholder="Attribute Name" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Create</button>
        </div>
    </form>
    <h2>Encrypt Data</h2>
    <form action="{{ url_for('encrypt_route') }}" method="post" class="mb-4">
        <div class="mb-3">
            <textarea class="form-control" name="message" placeholder="Message" required></textarea>
        </div>
        <div class="mb-3">
            <label>Select attributes:</label><br>
            {% for attr in attributes %}
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" name="attributes" value="{{ attr.name }}" id="attr{{ attr.id }}">
                <label class="form-check-label" for="attr{{ attr.id }}">{{ attr.name }}</label>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-success">Encrypt</button>
    </form>
    <h2>Encrypted Messages</h2>
    <table class="table">
        <thead><tr><th>ID</th><th>Policy</th><th>Decrypt</th></tr></thead>
        <tbody>
        {% for d in data %}
        <tr>
            <td>{{ d.id }}</td>
            <td>{{ d.policy }}</td>
            <td>
                <form action="{{ url_for('decrypt_route', data_id=d.id) }}" method="post" class="d-flex">
                    <select name="attribute" class="form-select me-2">
                        {% for attr in attributes %}
                        <option value="{{ attr.id }}">{{ attr.name }}</option>
                        {% endfor %}
                    </select>
                    <button class="btn btn-primary" type="submit">Decrypt</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
